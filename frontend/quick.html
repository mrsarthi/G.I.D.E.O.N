<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G.I.D.E.O.N — Quick Ask</title>
<style>
  /* Deliberately self-contained: no hologram, no Three.js, no WebGL. This
     window has to appear instantly and must not compete with the HUD for the
     4GB of VRAM the chat model is living in. */
  :root {
    --bg: #0a0e14;
    --panel: #111823;
    --edge: #1d2b3a;
    --accent: #35d0ff;
    --text: #dbe7f3;
    --muted: #6d8296;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--edge);
    border-radius: 10px;
  }

  /* easy_drag only moves the window from non-interactive regions, so the bar
     doubles as the drag handle for the frameless window. */
  #bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--edge);
    flex: 0 0 auto;
  }
  #dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    flex: 0 0 auto;
  }
  #dot.busy { animation: pulse 1s ease-in-out infinite; }
  #dot.err { background: #ff5d5d; box-shadow: 0 0 8px #ff5d5d; }
  @keyframes pulse { 50% { opacity: .25; } }
  #title { font-size: 12px; letter-spacing: .14em; color: var(--muted); flex: 1 1 auto; }
  .link {
    font-size: 11px; color: var(--muted); cursor: pointer;
    background: none; border: none; font-family: inherit;
  }
  .link:hover { color: var(--accent); }

  #ask {
    width: 100%;
    padding: 15px 16px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--edge);
    color: var(--text);
    font: 16px/1.4 inherit;
    resize: none;
    outline: none;
    flex: 0 0 auto;
    height: 56px;
  }
  #ask::placeholder { color: var(--muted); }

  #out {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 16px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
  }
  #out:empty::before {
    content: "Enter to send · Shift+Enter for a new line · Esc to dismiss";
    color: var(--muted);
    font-size: 12px;
  }
  #out.error { color: #ff8a8a; }
  #out::-webkit-scrollbar { width: 8px; }
  #out::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 4px; }

  #echo {
    color: var(--muted);
    font-size: 12px;
    padding: 0 16px 8px;
    flex: 0 0 auto;
  }
  #echo:empty { display: none; }

  /* Privileged actions wait for a click here; see renderApproval below. */
  #approvals { flex: 0 0 auto; padding: 0 16px; }
  #approvals:empty { display: none; }
  .approval {
    border: 1px solid #8a6a1a;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
    background: #17140c;
    font-size: 13px;
  }
  .approval.resolved { border-color: var(--edge); background: var(--panel); }
  .approval .head { font-size: 11px; letter-spacing: .12em; color: #ffb800; margin-bottom: 6px; }
  .approval.resolved .head { color: var(--muted); }
  .approval code {
    display: block;
    font: 12px/1.45 Consolas, "JetBrains Mono", monospace;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .approval .why { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .approval .result {
    font: 11px/1.45 Consolas, monospace;
    color: var(--muted);
    margin-top: 6px;
    max-height: 90px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .approval .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .approval button {
    font: 11px "Segoe UI", system-ui, sans-serif;
    letter-spacing: .08em;
    padding: 4px 12px;
    border-radius: 5px;
    border: 1px solid var(--edge);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .approval button.approve { border-color: var(--accent); color: var(--accent); }
  .approval button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
  <div id="bar">
    <span id="dot"></span>
    <span id="title">G.I.D.E.O.N · QUICK ASK</span>
    <button class="link" id="hud">Full HUD</button>
    <button class="link" id="close">Esc</button>
  </div>

  <textarea id="ask" placeholder="Ask G.I.D.E.O.N…" autofocus spellcheck="false"></textarea>
  <div id="echo"></div>
  <div id="approvals"></div>
  <div id="out"></div>

<script>
(function () {
  "use strict";

  const ask   = document.getElementById("ask");
  const out   = document.getElementById("out");
  const echo  = document.getElementById("echo");
  const dot   = document.getElementById("dot");
  const approvals = document.getElementById("approvals");
  const SESSION = window.GIDEON_QUICK_SESSION;
  const TOKEN   = window.GIDEON_API_TOKEN || "";

  let inFlight = null;

  /* The window is pre-warmed and hidden rather than created on demand, so it
     is shown far more often than it is loaded. Focus has to be re-taken on
     every show, not just once at startup. */
  function focusInput() {
    ask.focus();
    ask.setSelectionRange(ask.value.length, ask.value.length);
  }
  window.addEventListener("focus", focusInput);
  window.gideonOnShow = function (seed) {
    if (typeof seed === "string" && seed) {
      ask.value = seed;
      echo.textContent = "";
      out.textContent = "";
    }
    focusInput();
  };

  function hide() {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.hide) {
      window.pywebview.api.hide();
    }
  }

  document.getElementById("close").addEventListener("click", hide);
  document.getElementById("hud").addEventListener("click", function () {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.open_hud) {
      window.pywebview.api.open_hud();
    } else {
      window.open("/", "_blank");
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key !== "Escape") return;
    if (inFlight) {                 // first Esc stops generating
      inFlight.abort();
      inFlight = null;
    } else if (ask.value) {         // second clears the box
      ask.value = "";
    } else {                        // third dismisses the window
      hide();
    }
    event.preventDefault();
  });

  ask.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      send();
    }
  });

  /* Built with textContent only: the summary holds model-chosen arguments. */
  function renderApproval(action) {
    let card = document.getElementById("approval-" + action.action_id);
    if (!card) {
      card = document.createElement("div");
      card.id = "approval-" + action.action_id;
      approvals.appendChild(card);
    }
    const pending = action.status === "pending";
    card.className = "approval" + (pending ? "" : " resolved");
    card.textContent = "";

    const head = document.createElement("div");
    head.className = "head";
    head.textContent = (pending ? "APPROVAL NEEDED" : action.status.toUpperCase()) + " · #" + action.action_id;
    const code = document.createElement("code");
    code.textContent = action.summary || action.tool;
    card.append(head, code);

    if (pending && action.reason) {
      const why = document.createElement("div");
      why.className = "why";
      why.textContent = "Why: " + action.reason + ".";
      card.appendChild(why);
    }
    if (action.result) {
      const result = document.createElement("div");
      result.className = "result";
      result.textContent = action.result.slice(0, 1200);
      card.appendChild(result);
    }
    if (pending) {
      const buttons = document.createElement("div");
      buttons.className = "buttons";
      const deny = document.createElement("button");
      deny.textContent = "Deny";
      const approve = document.createElement("button");
      approve.className = "approve";
      approve.textContent = "Approve";
      deny.addEventListener("click", function () { decide(action.action_id, "deny", card); });
      approve.addEventListener("click", function () { decide(action.action_id, "approve", card); });
      buttons.append(deny, approve);
      card.appendChild(buttons);
    }
  }

  async function decide(actionId, decision, card) {
    card.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
    try {
      const res = await fetch("/api/actions/" + actionId + "/" + decision, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Gideon-Token": TOKEN }
      });
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.detail || ("HTTP " + res.status));
      renderApproval(data);
    } catch (err) {
      out.classList.add("error");
      out.textContent += "\n" + String(err.message || err);
      card.querySelectorAll("button").forEach(function (b) { b.disabled = false; });
    }
    focusInput();
  }

  async function send() {
    const message = ask.value.trim();
    if (!message || inFlight) return;

    ask.value = "";
    echo.textContent = "› " + message;
    out.textContent = "";
    approvals.textContent = "";
    out.classList.remove("error");
    dot.classList.remove("err");
    dot.classList.add("busy");

    const controller = new AbortController();
    inFlight = controller;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Gideon-Token": TOKEN },
        /* speak:false stops the server synthesising audio this window would
           only throw away — that CPU is competing with the model. */
        body: JSON.stringify({ session_id: SESSION, message: message, speak: false }),
        signal: controller.signal
      });

      if (!res.ok) {
        const detail = await res.json().catch(function () { return {}; });
        throw new Error(detail.detail || ("HTTP " + res.status));
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      for (;;) {
        const chunk = await reader.read();
        if (chunk.done) break;

        buffer += decoder.decode(chunk.value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith("data:")) continue;
          let payload;
          try {
            payload = JSON.parse(trimmed.slice(5).trim());
          } catch (err) {
            continue;
          }
          /* audio_url is ignored on purpose. This window is for typing at the
             desk — in a meeting, at night — so it stays silent. Speech is the
             HUD's job. */
          if (payload.text) {
            out.textContent += payload.text;
            out.scrollTop = out.scrollHeight;
          }
          if (payload.approval) {
            renderApproval(payload.approval);
          }
          if (payload.error) {
            out.classList.add("error");
            out.textContent += "\n" + payload.error;
          }
        }
      }
    } catch (err) {
      if (err.name !== "AbortError") {
        out.classList.add("error");
        dot.classList.add("err");
        out.textContent = String(err.message || err);
      }
    } finally {
      inFlight = null;
      dot.classList.remove("busy");
      focusInput();
    }
  }

  focusInput();
})();
</script>
</body>
</html>
