# Install once:  .venv\Scripts\pre-commit.exe install
# Local hooks run the versions pinned in uv.lock, so the hook and the
# editor/CI never disagree about what "clean" means.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest tests -q -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true
