# ---------------------------------------------------------------------------
#  Commands after earlier turns (F-17 fault 2, F-20). With plain-chat history
#  the model tends to answer a command in prose, and the harness has to force
#  a decision; tool calls in the history (replayed since F-20) show it how
#  earlier requests were handled. The report counts the forced calls.
# ---------------------------------------------------------------------------
[[case]]
id = "history-chat-open-calc"
prompt = "open calculator"
tool = "launch_app"
args = { app_name = "calc" }
category = "history"
history = [
  { role = "user", content = "What is the date and time?" },
  { role = "assistant", content = "It's Saturday, October 10, 2026 at 12:03 PM, sir." },
  { role = "user", content = "Can you check the time for me please" },
  { role = "assistant", content = "It's Saturday, October 10, 2026 at 12:04 PM, sir." },
]

[[case]]
id = "history-chat-pause"
prompt = "pause the music"
tool = "control_media"
args = { action = "play_pause" }
category = "history"
history = [
  { role = "user", content = "Tell me a fun fact about octopuses" },
  { role = "assistant", content = "Octopuses have three hearts and blue blood, boss." },
]

