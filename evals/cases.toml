# G.I.D.E.O.N eval set — real-model behaviour, not unit tests.
#
# Each case is one user message sent to a fresh session. Tools never really
# run: the runner records the call and returns a canned result.
#
#   tool  = "name"           the first tool call must be this tool
#   tools = ["a", "b"]       ...or any of these
#   tool  = "none"           no tool may be called
#   args  = { slot = "x" }   that slot must contain "x" (case-insensitive)
#   ask   = true             Gideon must ask a question instead of acting
#   forbid = ["tool"]        ...and must not call these meanwhile
#   history = [ { role = "user", content = "..." }, ... ]   prior turns
#   expect = ["x|y"]         the reply must mention each (x or y): facts it was given
#
# Categories: tool (pick the right tool), slots (fill it correctly), chat
# (no tool), clarify (never-assume, PRD §5.5), media (play vs. press play),
# projects (windows, project folders, project knowledge), history (commands
# after earlier turns; a turn can be a stored tool call:
#   { role = "tool_call", tool = "x", args = {...} } or { role = "tool", tool = "x", content = "..." }).
#
# Grow this file from real traces: every 👎 or correction is a candidate case.

